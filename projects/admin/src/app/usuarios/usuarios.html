@if (cargando()) {
  <p>Cargando...</p>
}
@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table>
  <thead>
    <tr><th>ID</th><th>Usuario</th><th>Roles</th><th>Habilitado</th><th></th></tr>
  </thead>
  <tbody>
    @for (u of usuarios(); track u.id) {
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.userName }}</td>
        <td>
          @for (r of u.roles; track r.id) {
            <span>{{ r.nombreRol }} </span>
          }
        </td>
        <td>{{ u.enabled ? 'Sí' : 'No' }}</td>
        <td>
          <button type="button" (click)="alternarHabilitado(u)">
            {{ u.enabled ? 'Deshabilitar' : 'Habilitar' }}
          </button>
          <button type="button" (click)="eliminar(u)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>
